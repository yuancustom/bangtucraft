name: bangtucraft
services:
  web:
    image: bangtucraft:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BANGTUTU_PORT:-18878}:8080"
    environment:
      BACKEND_URL: http://host.docker.internal:8787
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
